<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        .config-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            background: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #4285f4;
        }

        .save-btn {
            width: 100%;
            padding: 10px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .save-btn:hover {
            background: #3367d6;
        }

        .status {
            margin-top: 10px;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .info {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <h2>⚙️ Configurações</h2>

    <div class="config-group">
        <label for="targetLang">Idioma de Tradução:</label>
        <select id="targetLang">
            <option value="pt">Português</option>
            <option value="en">Inglês</option>
            <option value="es">Espanhol</option>
            <option value="fr">Francês</option>
            <option value="de">Alemão</option>
            <option value="it">Italiano</option>
            <option value="ja">Japonês</option>
            <option value="ko">Coreano</option>
            <option value="zh-CN">Chinês Simplificado</option>
            <option value="ru">Russo</option>
            <option value="ar">Árabe</option>
        </select>
    </div>

    <button class="save-btn" id="saveBtn">Salvar Configurações</button>

    <div class="status" id="status"></div>

    <div class="info">
        💡 <strong>Como usar:</strong><br>
        Selecione qualquer texto na página e clique no ícone de tradução que aparece.
    </div>

    <script src="popup.js"></script>
</body>

</html>
